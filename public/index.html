<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <title> dʌmi News · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="app login-wrap">
    <div class="login-card" id="card">
      <h1 class="brand"> dʌmi News</h1>
      <hr class="brand-rule" />
      <p class="tagline">Your daily content, curated by you.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="login" role="tab">Sign in</button>
        <button class="tab" data-mode="register" role="tab">Create account</button>
      </div>

      <form id="authForm" autocomplete="on" novalidate>
        <label class="field register-only hidden">
          <span>Your name</span>
          <input class="input" name="displayName" maxlength="40" placeholder="Your name Only" />
        </label>
        <label class="field">
          <span>Username</span>
          <input class="input" name="username" required autocomplete="username" placeholder="Username" />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" name="password" type="password" required autocomplete="current-password" placeholder="••••••" />
        </label>
        <p class="form-error" id="err"></p>
        <button class="btn btn-primary" type="submit" id="submitBtn">Sign in</button>
      </form>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/ambience.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
